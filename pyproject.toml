[project]
name = "radar"
version = "0.1.0"
description = "Schwachstellen-Radar: from security advisory to approved patch ticket"
requires-python = ">=3.12,<3.13"
# Phase 0 only needs what the skeleton uses. Each later phase adds its
# dependencies when the code that needs them arrives.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pydantic>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
